name: Build plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Paper API
        run: mvn --batch-mode --no-transfer-progress clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DragonEggLocator-jar
          path: target/DragonEggLocator-*.jar
